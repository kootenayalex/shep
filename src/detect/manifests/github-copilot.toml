id = "copilot"
version = "2026.09.11.1"
min_engine_version = 1
updated_at = "2026-09-11T00:00:00Z"
aliases = ["github-copilot", "ghcs"]

[launch]
bin = "copilot"
version_args = ["--version"]
argv = ["copilot"]

# copilot runs non-interactively when its prompt arrives on a stdin pipe.
[headless]
argv = ["copilot"]
prompt = "stdin"
output = "text"

[[rules]]
id = "selection_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
all = [
  { any = [
    { contains = ["esc to cancel"] },
    { contains = ["esc cancel"] },
  ] },
  { any = [
    { contains = ["enter to select"] },
    { contains = ["enter to confirm"] },
    { contains = ["enter to submit"] },
    { contains = ["enter accept"] },
  ] },
]

[[rules]]
id = "working_cancel_hint"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
any = [
  { contains = ["esc to cancel"] },
  { contains = ["esc cancel"] },
  { contains = ["esc again to cancel"] },
  { contains = ["esc interrupt"] }
]
