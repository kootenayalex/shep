# A6 E2E — pairing (typed path, incl. the crash-regression territory) → home.
# Needs a bridge on 127.0.0.1:7432 (AVD sees it as 10.0.2.2) and SHEP_TOKEN:
#   maestro --device emulator-5554 test -e SHEP_TOKEN=$(cat ~/.config/shep/bridge-token) maestro/01-pair-and-home.yaml
# Text anchors only (no ids) per device-testing conventions.
appId: dev.shep.companion
---
- launchApp:
    clearState: true
- assertVisible: "the cockpit in your pocket"
# The URL field is pre-filled; retarget it at the host bridge.
- tapOn: "ws://100.64.0.0:7431/"
- eraseText
- inputText: "ws://10.0.2.2:7432/"
# Landscape/tablet: the IME covers the Token field — drop it before tapping.
- hideKeyboard
- tapOn: "Token"
- inputText: "${SHEP_TOKEN}"
- hideKeyboard
- tapOn: "Connect"
# Android 13+ notification permission prompt fires after pairing.
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
# Home: header, live status, and the default attention filter chip.
# (Maestro plain strings are full-text regexes — "attention 0" needs a wildcard.)
- assertVisible: "agents"
- assertVisible: "live.*"
- assertVisible: "attention.*"
