# A6 E2E — pairing (typed path, incl. the crash-regression territory) → home.
# Needs SHEP_TOKEN and SHEP_BRIDGE_URL as the DEVICE sees the bridge:
#   AVD:    -e SHEP_BRIDGE_URL=ws://10.0.2.2:7432/
#   phone:  -e SHEP_BRIDGE_URL=ws://100.83.179.75:7431/   (tailnet)
# Text anchors for content, ids for the navigation chrome (the hint bar and
# the `desktop | board` pill share their labels with the board's headings).
# IDEMPOTENT: no clearState (OxygenOS/ColorOS block `pm clear` for shell);
# the pairing block only runs when the pairing screen is showing, so the same
# flow works on a fresh install and on an already-paired device.
appId: dev.shep.companion
---
- launchApp
- runFlow:
    when:
      visible: "the cockpit in your pocket"
    commands:
      # The two fields moved under a disclosure: the first screen is now the
      # two steps and the scan/type buttons.
      - tapOn: "address and token"
      # The URL field is pre-filled (default or a saved value) — the regex
      # matches either; retarget it at the host bridge.
      - tapOn: "ws://.*"
      - eraseText
      - inputText: "${SHEP_BRIDGE_URL}"
      # Landscape/tablet: the IME covers the Token field — back dismisses it
      # (pressKey works everywhere; hideKeyboard is UNAVAILABLE on OxygenOS).
      - pressKey: back
      # A saved-but-refused token is pre-filled and unreadable; its clear
      # button is the only reliable way to start from an empty field
      # (tapping the label parks the caret at the front of the old value).
      - runFlow:
          when:
            visible: "clear token"
          commands:
            - tapOn: "clear token"
      - tapOn: "pairing token"
      - inputText: "${SHEP_TOKEN}"
      - pressKey: back
      - tapOn: "connect"
      # A successful link now lands on its own step, and the board (and so the
      # Android 13+ notification prompt) comes after the button on it.
      - tapOn: "go to agents"
      - runFlow:
          when:
            visible: "Allow"
          commands:
            - tapOn: "Allow"
# Landed — on either view. A fresh pairing ends on "go to agents"; a device
# that was already paired lands on the board, which is where the app now opens.
# What both carry is the `desktop | board` pill and the connection line, so
# those are what this asserts: `agents` is no longer a word on the agents
# screen at all (the header reads `shep · agents` as separate nodes) and it IS
# a word on the board (a region heading), which is the wrong way round.
# The connection line reads "live · shep <version>" — a plain Maestro string is
# a full-text regex, not a substring, so it needs the wildcard.
- assertVisible:
    id: "pill-desktop"
- assertVisible:
    id: "pill-board"
- assertVisible: "live.*"
