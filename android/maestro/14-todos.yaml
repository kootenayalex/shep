# An agent's own checklist, read back out of its session.
# Needs a paired app (run 01 first) against a bridge with at least one agent.
# Text anchors for content, ids for the navigation chrome (the hint bar and
# the `desktop | board` pill share their labels with the board's headings).
#
# Deliberately types nothing: the todo view is read-only, and this runs
# against Alex's real agents.
appId: dev.shep.companion
---
- launchApp
# The app lands on the board; the pill is the switch to the session view.
- tapOn:
    id: "pill-desktop"
- tapOn:
    text: "agent .*"
    index: 0

# The action row carries it beside review, not as a third output mode.
- assertVisible: "todos"
- tapOn: "todos"

# The sheet says one of a handful of things, and every one of them is an
# answer: a count, an empty checklist, or why it could not read the session —
# including `no todo reader for agent (none)`, which is what a plain shell
# says and what the first row on a throwaway server usually is. An agent with
# no checklist is the common case on a real machine, so the flow passes on any
# of them rather than seeding state it cannot clean up.
- assertVisible:
    text: "(.* left.*|no checklist in this session|reading the session…|.*not a claude.*|.*no session.*|.*no todo reader.*)"

# Read-only: nothing in the sheet offers to change the list.
- assertNotVisible: "add"
- assertNotVisible: "save"

# And it closes back to the pane, which still has its own controls.
- tapOn: "cancel"
- assertVisible: "out"
