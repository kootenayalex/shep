# The docket tab: the desktop board's lanes and verbs on the phone.
# Needs a paired app (run 01 first). Text anchors for content, ids for the
# navigation chrome (the bar's `docket` and the board's `docket` heading are
# the same word).
#
# Adds one item so it can see the list render; run it against a throwaway
# server, not the one that owns your docket — `+ add` writes to docket.db.
appId: dev.shep.companion
env:
  TITLE: "maestro docket probe"
---
- launchApp
# `docket` is both a hint-bar entry and the board's docket region heading, and
# the board is what the app opens on — a plain `tapOn: "docket"` took the
# heading, which does nothing. The bar's entries carry ids for exactly this.
- tapOn:
    id: "hint-docket"
- assertVisible: "\\+ add"

# Empty or not, the screen says so; the add sheet is the same either way.
- tapOn: "\\+ add"
- assertVisible: "add to docket"
- tapOn: "title"
- inputText: "${TITLE}"
- pressKey: back
- tapOn: "add"

# A captured item lands in the inbox lane, id first.
- assertVisible: "inbox"
- assertVisible: "${TITLE}"
- assertVisible: "#[0-9]+"
# The kind/date row is separate text nodes; an undated item shows the dash.
- assertVisible: "captured"
- assertVisible: "—"
