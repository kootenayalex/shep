# Spaces tree: the session's shape, and the controls that change it.
# Needs a paired app (run 01 first) against a bridge with at least one space.
# Text anchors only (no ids) per device-testing conventions.
#
# Deliberately does NOT close anything: a flow that destroys spaces cannot be
# run against a real session, and this one is meant to be.
appId: dev.shep.companion
---
- launchApp
- tapOn: "agents"
# Header and the affordance for opening a session from here.
- assertVisible: "agents"
- tapOn: "all.*"
- assertVisible: "\\+ new"
# Space actions live behind the workspace overflow menu so the list stays
# readable on a phone.
- tapOn: "space actions"
- assertVisible: "go to"
- assertVisible: "new tab"
- assertVisible: "rename space"
# Pane-level actions remain available through the row's long-press menu; this
# flow avoids destructive or timing-sensitive gestures on the live session.
- pressKey: back

# The new-session sheet opens and asks the three things shep needs.
- tapOn: "\\+ new"
- assertVisible: "new session"
- assertVisible: "directory"
- assertVisible: "run"
# The runtimes, including a plain shell as a first-class choice.
- assertVisible: "claude"
- assertVisible: "terminal"
# Back dismisses the sheet (hideKeyboard is unavailable on OxygenOS).
- pressKey: back
- assertVisible: "agents"
