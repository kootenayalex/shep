# Key bar: ^C interrupts, a double tap locks a sticky modifier (the label grows
# a dot) and a tap on a locked one clears it.
#
# Arming for a single key used to be proved here as `shift` + `y` reaching the
# pty as `Y`. The bar has no literal-character keys left — agents ask with a
# menu now, so `y`/`n` went — and an armed modifier looks exactly like an idle
# one to a text assertion; only Locked carries the dot. That half is pinned
# where it can actually be asserted instead: `ModifierState.advance` and
# `keyCombo` in KeyComboTest.kt, and `parse_key_combo` on the server.
appId: dev.shep.companion
---
# -e AGENT=… / -e MARK=… override these; a flow-level `env:` would win over -e.
- evalScript: "${output.agent = typeof AGENT === 'undefined' ? 'shell' : AGENT}"
- launchApp
- tapOn: "agents"
- tapOn: "agent ${output.agent}"
- assertVisible: "esc"
- tapOn:
    id: "terminal-grid"
- waitForAnimationToEnd:
    timeout: 2000
- inputText: "sleep 30"
- tapOn: "↵"
# The control keys live past the arrows in the bar's scrolling row.
- swipe:
    from:
      text: "↓"
    direction: LEFT
    duration: 400
- tapOn: "\\^C"
# The shell echoes the interrupt and comes back to a prompt.
- assertVisible: "(?s).*\\^C.*"
- swipe:
    from:
      text: "\\^C"
    direction: RIGHT
    duration: 400
# Locked: the label carries a dot until tapped again. The row may have come
# back from the control keys short of its start; a swipe from a key that is
# always visible settles it.
- swipe:
    from:
      text: "alt"
    direction: RIGHT
    duration: 400
- doubleTapOn: "ctrl"
- assertVisible: "ctrl•"
- tapOn: "ctrl•"
- assertNotVisible: "ctrl•"
# Leave the prompt line clean for the next flow.
- swipe:
    from:
      text: "↓"
    direction: LEFT
    duration: 400
- tapOn: "\\^C"
- pressKey: back
