# ntfy UnifiedPush broker for the shep Android companion.
#
# ntfy runs as a container (the macOS ntfy bottle is client-only — no `serve`),
# published to loopback only. A Tailscale sidecar (forge's proven pattern) puts
# it on the tailnet as https://ntfy.tail58187b.ts.net/ with a real cert. Docker
# bypasses the host firewall, so the backend binds 127.0.0.1 and is reachable
# only through the sidecar's `tailscale serve`.
#
# Bring up:  docker compose -f deploy/ntfy/docker-compose.yml up -d
# (up -d, not restart — serve.json / env changes only apply on recreate)

services:
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: ntfy
    command: ["serve"]
    environment:
      NTFY_BASE_URL: "https://ntfy.tail58187b.ts.net"
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_AUTH_DEFAULT_ACCESS: "read-write"
      NTFY_CACHE_FILE: "/var/cache/ntfy/cache.db"
      NTFY_CACHE_DURATION: "12h"
      NTFY_UPSTREAM_BASE_URL: ""
      NTFY_ENABLE_METRICS: "false"
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-lib:/var/lib/ntfy
    ports:
      # Loopback only — the tailnet reaches it through the sidecar, not here.
      - "127.0.0.1:2587:80"
    restart: unless-stopped

  tailscale-ntfy:
    image: tailscale/tailscale:latest
    container_name: tailscale-ntfy
    hostname: ntfy
    environment:
      TS_AUTHKEY: file:/run/secrets/ts_authkey
      TS_HOSTNAME: ntfy
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-tags=tag:server
    volumes:
      - ntfy-ts-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    secrets:
      - ts_authkey
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

secrets:
  ts_authkey:
    file: ${HOME}/.config/ntfy-tailscale/ts_authkey

volumes:
  ntfy-cache:
  ntfy-lib:
  ntfy-ts-state:
